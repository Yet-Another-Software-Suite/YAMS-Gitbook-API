<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55607a"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<rect x="60" y="30" width="330" height="70" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/><text x="225.0" y="61.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2b4a" font-family="Helvetica, Arial, sans-serif">Pull request</text><text x="225.0" y="83.0" text-anchor="middle" font-size="13" fill="#44516b" font-family="Helvetica, Arial, sans-serif">runs the groups its changes can affect</text>
<rect x="510" y="30" width="330" height="70" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/><text x="675.0" y="61.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2b4a" font-family="Helvetica, Arial, sans-serif">Push to master</text><text x="675.0" y="83.0" text-anchor="middle" font-size="13" fill="#44516b" font-family="Helvetica, Arial, sans-serif">runs every group</text>
<line x1="225" y1="100" x2="400" y2="160" stroke="#55607a" stroke-width="2" marker-end="url(#a)"/>
<line x1="675" y1="100" x2="500" y2="160" stroke="#55607a" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="160" width="400" height="70" rx="10" fill="#fff6e5" stroke="#d08a1b" stroke-width="2"/><text x="450.0" y="191.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2b4a" font-family="Helvetica, Arial, sans-serif">select_test_groups.py</text><text x="450.0" y="213.0" text-anchor="middle" font-size="13" fill="#44516b" font-family="Helvetica, Arial, sans-serif">matches each changed file to groups</text>
<line x1="380" y1="230" x2="225" y2="300" stroke="#55607a" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="230" x2="675" y2="300" stroke="#55607a" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="300" width="330" height="70" rx="10" fill="#eaf7ee" stroke="#2f9a55" stroke-width="2"/><text x="225.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2b4a" font-family="Helvetica, Arial, sans-serif">Java groups (20)</text><text x="225.0" y="353.0" text-anchor="middle" font-size="13" fill="#44516b" font-family="Helvetica, Arial, sans-serif">./gradlew test --tests ...</text>
<rect x="510" y="300" width="330" height="70" rx="10" fill="#eaf7ee" stroke="#2f9a55" stroke-width="2"/><text x="675.0" y="331.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2b4a" font-family="Helvetica, Arial, sans-serif">C++ groups (9)</text><text x="675.0" y="353.0" text-anchor="middle" font-size="13" fill="#44516b" font-family="Helvetica, Arial, sans-serif">./gradlew catchTests -PcatchFilter=...</text>
<text x="450.0" y="420" text-anchor="middle" font-size="14" fill="#44516b" font-family="Helvetica, Arial, sans-serif">Each group runs on its own runner, in its own JVM or test process.</text>
<text x="450.0" y="444" text-anchor="middle" font-size="14" fill="#44516b" font-family="Helvetica, Arial, sans-serif">test_summary.py then writes a pass and fail table for each group.</text>
</svg>